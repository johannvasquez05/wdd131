<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Leave a quick product review. Share ratings, comments, and feedback to help us improve our products.">
    <meta name="author" content="Johann Vasquez">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&family=Raleway:wght@500&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>
    <main>

        <form method="get" action="review.html" class="wf1">
            <fieldset>
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>

                <label>Overall Rating</label>
                <div class="rating-group">
                    <div class="rating-option">
                        <label for="star1">☆</label>
                        <input id="star1" type="radio" name="rating" value="1" required>
                    </div>
                    <div class="rating-option">
                        <label for="star2">☆☆</label>
                        <input id="star2" type="radio" name="rating" value="2">
                    </div>
                    <div class="rating-option">
                        <label for="star3">☆☆☆</label>
                        <input id="star3" type="radio" name="rating" value="3">
                    </div>
                    <div class="rating-option">
                        <label for="star4">☆☆☆☆</label>
                        <input id="star4" type="radio" name="rating" value="4">
                    </div>
                    <div class="rating-option">
                        <label for="star5">☆☆☆☆☆</label>
                        <input id="star5" type="radio" name="rating" value="5">
                    </div>
                </div>

                <label>Date of Installation <input id="installation" type="date" name="installationDate"
                        required></label>

                <label>Which features did you find useful in the product?<br><span>(Check all
                        that apply)</span></label>
                <label><input id="checkbox1" type="checkbox" name="durability" value="good"> Durability</label>
                <label><input id="checkbox2" type="checkbox" name="easeUse" value="good"> Ease of Use</label>
                <label><input id="checkbox3" type="checkbox" name="performance" value="good"> Perfomance</label>
                <label><input id="checkbox4" type="checkbox" name="design" value="good"> Design</label>

                <label>Written Review<span> (optional)</span>
                    <textarea id="review" name="review"></textarea></label>

                <label>Your name<span> (optional)</span><input id="name" type="text" name="fullname"></label>

                <input type="submit" value="Send Review">
            </fieldset>

        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> / Johann Vasquez / Panama</p>
        <p class="date">Last Modification: <span id="lastmodified"></span></p>
    </footer>

</body>

</html>
